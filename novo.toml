[package]
name        = "brotli-nv"
version     = "0.1.0"
description = "RFC 7932 Brotli, decoder first: the stream header and its window bits, meta-blocks, simple and complex prefix codes, context modelling for literals and distances, and the STATIC DICTIONARY with its word transforms as data this package owns.  The load-bearing call is `brotlidist.resolve`: a distance past the current output position is not an error but a dictionary reference, which is what a third of real HTTP responses contain.  Feed-and-drain over a window the caller sizes; the encoder declared for quality 0 to 4."
license     = "Apache-2.0"

stability   = "experimental"

# `core`.  A compressed stream is bytes somebody else read — an HTTP
# body, a file, a cache entry — and turning it back into bytes is
# arithmetic over a window the CALLER sized.  The decoder is a
# feed-and-drain state machine, which is how a `core` package takes a
# stream it must not accumulate (`docs/publishing.md` § How a `core`
# package takes bytes from its host, first shape).
#
# The window is the one number that could have made this `host`: a
# stream header may demand 16 MiB, and a package that allocated on a
# number out of a file would be a denial of service with a decoder on
# the front.  So the number crosses the interface before anything is
# allocated and the caller decides.
layer       = "core"

category    = "compression"

tags        = ["brotli", "rfc7932", "compression", "decompression", "content-encoding", "http", "sans-io"]
repository  = "https://github.com/novolang/brotli-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.22.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A distance past the end of the output is not a mistake"
